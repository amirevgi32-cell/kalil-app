<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eefaf6">
<title>קליל – ירידה במשקל</title>

<style>@font-face{font-family:'Rubik';src:url(fonts/rubik-hebrew-400-normal.woff2) format('woff2');font-weight:400 500;font-display:swap}@font-face{font-family:'Rubik';src:url(fonts/rubik-latin-400-normal.woff2) format('woff2');font-weight:400 500;font-display:swap}@font-face{font-family:'Rubik';src:url(fonts/rubik-hebrew-700-normal.woff2) format('woff2');font-weight:600 800;font-display:swap}@font-face{font-family:'Rubik';src:url(fonts/rubik-latin-700-normal.woff2) format('woff2');font-weight:600 800;font-display:swap}@font-face{font-family:'Secular One';src:url(fonts/secular-one-hebrew-400-normal.woff2) format('woff2');font-weight:400;font-display:swap}@font-face{font-family:'Secular One';src:url(fonts/secular-one-latin-400-normal.woff2) format('woff2');font-weight:400;font-display:swap}
/* VOICE: arcade coach — loud, glowing, rewarding every tap
   IDEA: a neon arcade cabinet: every log is a coin, every meal gets a score sticker
   PICTURE: the glowing calorie ring with Avoki inside; a water bottle that sloshes
   COLOUR and TYPE: night #2f3a3d, turquoise #2ec4a0, neon pink #ff8a65, lime #7dd35a; Secular One + Rubik
   LAYOUT: phone app — glowing hero, chunky 3D buttons, quest cards, bottom tab bar */
:root{color-scheme:light;--bg:#ffffff;--card:#ffffff;--card2:#f2f8f6;--ink:#2f3a3d;--mute:#76878a;--line:#e2ebe8;
--mango:#2ec4a0;--mango-d:#169a7e;--mango2:#e2f7f0;--pink:#ff8a65;--pink2:#fff0ea;
--lime:#7dd35a;--lime2:#eef8e8;--red:#ef5b5b;--red2:#fdeaea;--blue:#4aa8ff;--blue2:#e8f3ff;--gold:#f6b93b;
--sh:0 6px 22px rgba(40,90,80,.09);--disp:'Secular One',Rubik,sans-serif}
*{box-sizing:border-box;min-width:0}
html{-webkit-tap-highlight-color:transparent;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Rubik,system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-bottom:calc(100px + env(safe-area-inset-bottom))}
.hero{background:radial-gradient(circle at 10% 0%,rgba(255,138,101,.22),transparent 50%),radial-gradient(circle at 95% 40%,rgba(46,196,160,.25),transparent 55%),#eefaf6;padding:calc(14px + env(safe-area-inset-top)) 18px 24px;border-radius:0 0 34px 34px;position:relative;overflow:hidden}
.hero::after{display:none;content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.5) 1px,transparent 1.5px);background-size:46px 46px;opacity:.12;pointer-events:none}
.hero>*{position:relative;z-index:1}
.top{display:flex;align-items:center;gap:10px}
.top h1{font:26px/1 var(--disp);margin:0;flex:1;background:linear-gradient(90deg,var(--mango),var(--lime));-webkit-background-clip:text;background-clip:text;color:transparent}
.ib{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(47,58,61,.08);color:var(--ink)}
.ib svg{width:22px;height:22px}
.datebar{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px;font-weight:500}
.datebar .ib{width:40px;height:40px;background:transparent}
.ringwrap{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;margin-top:4px}
.ring{position:relative;width:min(220px,54vw);aspect-ratio:1}
.ring svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ring .glow{filter:drop-shadow(0 0 6px currentColor)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .big{font:clamp(38px,11vw,52px)/1 var(--disp)}
.ring .lbl{font-size:14px;color:var(--mute)}
.side{text-align:center;font-size:13px;color:var(--mute)}.side b{display:block;font:24px/1.2 var(--disp);color:var(--ink)}
.bubble{display:flex;align-items:center;gap:10px;background:rgba(47,58,61,.08);border:1px solid rgba(47,58,61,.08);border-radius:18px;padding:8px 12px;margin-top:14px;font-size:15px}
.bubble svg{flex:none;width:48px;height:48px;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) rotate(-3deg)}}
.chipf svg{width:16px;height:16px}
.chipf.stpill{background:var(--mango2);color:var(--mango-d);border-color:rgba(46,196,160,.45);font-size:15px;padding:6px 14px}.chipf.stpill b{font:18px var(--disp)}
.chipf{display:inline-flex;align-items:center;gap:6px;background:var(--pink2);color:var(--pink);border:1px solid rgba(255,138,101,.4);border-radius:20px;padding:4px 12px;font-weight:700;font-size:14px;margin-top:8px}
.wrap{padding:0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--sh);padding:16px;margin-top:14px}
.card h2{font:20px/1.2 var(--disp);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
.macros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mac{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 12px}
.mac small{color:var(--mute);font-size:13px;display:block}.mac b{font:19px var(--disp)}
.bar{height:8px;border-radius:9px;background:rgba(47,58,61,.08);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;border-radius:9px;box-shadow:0 0 10px currentColor}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.qa{background:var(--card2);border-radius:20px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px;font-weight:700;box-shadow:0 5px 0 #d6e3df;min-height:84px;justify-content:center}
.qa:active{transform:translateY(4px);box-shadow:0 1px 0 #d6e3df}
.qa svg{width:30px;height:30px}
.meal .row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.meal .row:first-of-type{border-top:0}
.row .nm{flex:1}.row .nm small{display:block;color:var(--mute);font-size:13px}
.kc{font:17px var(--disp);white-space:nowrap}
.del{width:36px;height:36px;border-radius:12px;color:var(--mute);display:grid;place-items:center}
.del svg{width:18px;height:18px}
.sticker{min-width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font:20px var(--disp);transform:rotate(-8deg);flex:none}
.sticker.s{min-width:42px;height:42px;font-size:16px}
.g1{background:var(--lime);color:#2f3a3d;box-shadow:0 0 16px rgba(125,211,90,.55)}.g2{background:var(--gold);color:#2f3a3d;box-shadow:0 0 16px rgba(246,185,59,.5)}
.g3{background:var(--pink);color:#fff;box-shadow:0 0 16px rgba(255,138,101,.55)}.g4{background:var(--red);color:#fff;box-shadow:0 0 16px rgba(239,91,91,.5)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:16px;font-weight:700;background:var(--mango-d);color:#fff;box-shadow:0 4px 0 #0f7a63;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0f7a63}
.btn.ghost{background:var(--mango2);color:var(--mango-d);box-shadow:0 4px 0 #d6e3df}
.btn.pink{background:var(--pink);color:#fff;box-shadow:0 4px 0 #e0663f}
.btn.lime{background:var(--lime);color:#2f3a3d;box-shadow:0 4px 0 #5aa83c}
.btn.full{width:100%}.btn svg{width:20px;height:20px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btns .btn{flex:1;padding:0 10px;white-space:nowrap}
.muted{color:var(--mute)}.small{font-size:13px}
.bottle{display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;align-items:center}
.bottle svg{width:110px;height:180px}
.wave{animation:wv 3s linear infinite}@keyframes wv{to{transform:translateX(-80px)}}
.wbig{font:34px/1 var(--disp);color:var(--blue)}
.tabs{position:fixed;inset:auto 0 0 0;background:rgba(255,255,255,.96);box-shadow:0 -4px 18px rgba(40,90,80,.08);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:20}
.tabs .in{display:flex;width:100%;max-width:560px;align-items:center}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--mute);min-height:52px;justify-content:center}
.tab svg{width:24px;height:24px}.tab.on{color:var(--mango-d);font-weight:700}.tab.on svg{filter:drop-shadow(0 0 6px var(--mango))}
.fab{width:64px;height:64px;border-radius:22px;background:var(--pink);color:#fff;display:grid;place-items:center;margin-top:-32px;box-shadow:0 0 24px rgba(255,138,101,.6),0 5px 0 #e0663f}
.fab:active{transform:translateY(3px)}
.fab svg{width:32px;height:32px}
.sheet{position:fixed;inset:0;background:rgba(30,55,50,.35);z-index:40;display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet-in{background:var(--bg);border:1px solid var(--line);border-bottom:0;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,1.4,.4,1)}
@keyframes up{from{transform:translateY(60px);opacity:.3}}
.sh-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}.sh-top h3{flex:1;margin:0;font:22px var(--disp)}
.x{width:44px;height:44px;border-radius:14px;background:var(--card);display:grid;place-items:center}.x svg{width:20px;height:20px}
input[type=text],input[type=number],input[type=search],input[type=time],select,textarea{width:100%;min-height:48px;border-radius:14px;border:2px solid var(--line);background:var(--card);padding:10px 14px;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--mango);outline:0;box-shadow:0 0 0 4px var(--mango2)}
label.f{display:block;margin-top:12px;font-weight:500}label.f span{display:block;font-size:14px;margin-bottom:4px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:20px;background:var(--card);border:2px solid var(--line);font-size:14px;font-weight:500}
.chip.on{background:var(--mango-d);color:#fff;border-color:var(--mango-d)}
.seg{display:flex;flex-wrap:wrap;gap:6px}.seg button{flex:1 1 auto;min-height:44px;border-radius:14px;background:var(--card);border:2px solid var(--line);padding:4px 10px;font-size:14px}
.seg button.on{border-color:var(--mango);background:var(--mango2);color:var(--mango-d);font-weight:700}
.food{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);width:100%;text-align:start;min-height:56px}
.dot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
.food .nm{flex:1}.food small{display:block;color:var(--mute);font-size:13px}
.step{display:flex;align-items:center;gap:8px}.step button{width:48px;height:48px;border-radius:14px;background:var(--card);border:2px solid var(--line);font-size:22px;font-weight:700}
.step .btn{width:auto;height:auto;border:0;font-size:16px;padding:0 20px;background:var(--mango-d);color:#fff}
.step input{text-align:center;font:22px var(--disp)}
.nut{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.nut div{background:var(--card);border-radius:14px;padding:8px;text-align:center}.nut b{display:block;font:20px var(--disp)}.nut small{color:var(--mute);font-size:13px}
.kbig{font:50px/1 var(--disp);color:var(--mango-d);text-shadow:0 0 18px rgba(46,196,160,.5)}
ul.why{list-style:none;padding:0;margin:8px 0}ul.why li{display:flex;gap:8px;padding:6px 0;align-items:flex-start}
ul.why li i{flex:none;min-width:24px;height:24px;border-radius:12px;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;margin-top:1px;padding:0 4px;transform:none}
.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--card2);border-radius:16px;padding:12px}.stat small{color:var(--mute);display:block;font-size:13px}.stat b{font:22px var(--disp);white-space:nowrap}
.goalhero{color:#fff;background:linear-gradient(135deg,#2ec4a0,#169a7e);border:0;border-radius:24px;padding:18px;margin-top:14px;box-shadow:0 0 30px rgba(255,138,101,.2)}
.goalhero .d{font:clamp(30px,8vw,40px)/1.1 var(--disp);margin:4px 0;color:#fff}.goalhero .prog{background:rgba(255,255,255,.3)}.goalhero .prog i{background:#fff;box-shadow:none}
.prog{height:14px;border-radius:9px;background:rgba(47,58,61,.08);overflow:hidden;margin:12px 0 6px}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--mango),var(--lime));border-radius:9px;box-shadow:0 0 12px var(--lime)}
.fig{position:relative;height:220px}.fig svg{direction:ltr;position:absolute;inset:0;width:100%;height:100%}
.week{display:flex;align-items:flex-end;gap:6px;height:150px;position:relative;padding-top:10px}
.week .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:12px;color:var(--mute)}
.week .col i{width:100%;max-width:34px;border-radius:9px 9px 4px 4px;background:var(--mango);min-height:3px;box-shadow:0 0 10px rgba(46,196,160,.4)}
.week .col i.over{background:var(--pink)}
.week .ln{position:absolute;inset-inline:0;border-top:2px dashed var(--lime);pointer-events:none;opacity:.7}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bd{background:var(--card2);border-radius:18px;padding:12px 6px;text-align:center;font-size:13px;color:var(--mute)}
.bd svg{width:54px;height:54px;display:block;margin:0 auto 6px}.bd b{display:block;font-size:14px;color:var(--ink)}
.bd.off{opacity:.4;filter:grayscale(1)}
.bd:not(.off) svg{filter:drop-shadow(0 0 8px rgba(246,185,59,.6))}
.lvl{display:flex;align-items:center;gap:14px}
.credit{text-align:center;color:var(--mute);font-size:13px;margin:22px 14px 8px}
.credit b{color:var(--pink)}
.toast{position:fixed;top:calc(16px + env(safe-area-inset-top));inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;font-weight:800;z-index:60;transition:.3s cubic-bezier(.2,1.5,.4,1);opacity:0;transform:translateY(-30px) scale(.8);pointer-events:none;box-shadow:0 0 24px rgba(125,211,90,.6)}
.toast.on{opacity:1;transform:none}
#cf{position:fixed;inset:0;pointer-events:none;z-index:70;width:100%;height:100%}
.empty{color:var(--mute);font-size:14px;padding:6px 0}
.ex{border-color:rgba(74,168,255,.35)}
.lesson{background:linear-gradient(135deg,#fff1ea,#ffffff 65%);border:1px solid rgba(255,138,101,.45);box-shadow:0 0 26px rgba(255,138,101,.18)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:12px;background:var(--pink2);color:var(--pink)}
.quest{display:flex;align-items:center;gap:10px;padding:8px 0}
.quest .ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-weight:800;color:#2f3a3d}
.quest.done .ck{background:var(--lime);border-color:var(--lime);box-shadow:0 0 12px rgba(125,211,90,.6)}
.quest.done .qt{text-decoration:line-through;color:var(--mute)}
.quest .xp{font-size:13px;color:var(--gold);font-weight:700}
.opt{display:block;width:100%;text-align:start;padding:12px 14px;border-radius:14px;background:var(--card2);border:2px solid var(--line);margin-top:8px;font-weight:500;min-height:48px}
.opt.ok{border-color:var(--lime);background:var(--lime2)}.opt.no{border-color:var(--red);background:var(--red2)}
.fring{position:relative;width:min(260px,70vw);aspect-ratio:1;margin:8px auto 0}
.fring svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.fring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.fring .t{font:clamp(36px,11vw,48px)/1 var(--disp);direction:ltr}
.stage{display:flex;gap:10px;padding:8px 0;align-items:flex-start;opacity:.45}
.stage.on{opacity:1}.stage.now{opacity:1}
.stage .sd{width:14px;height:14px;border-radius:50%;background:var(--line);flex:none;margin-top:5px}
.stage.on .sd{background:var(--mango);box-shadow:0 0 10px var(--mango)}.stage.now .sd{background:var(--pink);box-shadow:0 0 14px var(--pink);animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.4)}}
.photo{width:100%;max-height:240px;object-fit:cover;border-radius:18px;display:block}
.ai-row{display:grid;grid-template-columns:minmax(0,1fr) 84px auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ai-row input{min-height:42px;padding:6px 8px;text-align:center}
.spin{width:34px;height:34px;border-radius:50%;border:4px solid var(--mango2);border-top-color:var(--mango);animation:sp 1s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.pop{animation:pop .4s cubic-bezier(.2,1.8,.4,1)}@keyframes pop{from{transform:scale(.6)}}
.traybar{position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom));background:var(--bg);padding:10px 0 calc(10px + env(safe-area-inset-bottom));margin-top:6px}
.row button.nm{display:block;text-align:start;padding:4px 0;min-height:44px;flex:1}
.mscore{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:start;background:var(--mango2);border-radius:14px;padding:8px 12px;margin-top:10px;min-height:44px}.mscore b{color:var(--mango-d)}.mscore span{font-size:13px;color:var(--mute)}
.card.mini{padding:10px 16px}.card.mini h2{margin:0}
.mb{width:44px;height:44px;border-radius:14px;background:var(--mango2);color:var(--mango-d);display:grid;place-items:center}.mb svg{width:20px;height:20px}
.food{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid var(--line);width:100%}
.fpick{flex:1;display:flex;align-items:center;gap:10px;text-align:start;min-height:52px;padding:6px 4px}.fpick .nm{flex:1}.fpick small{display:block;color:var(--mute);font-size:13px}
.qplus{width:44px;height:44px;border-radius:50%;background:var(--mango-d);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 3px 0 #0f7a63}.qplus svg{width:20px;height:20px}
.undo{position:fixed;inset-inline:16px;bottom:calc(84px + env(safe-area-inset-bottom));margin:auto;max-width:520px;background:var(--ink);color:#fff;border-radius:16px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:10px;z-index:55;box-shadow:var(--sh)}
.undo span{flex:1}.undo button{color:var(--lime);font-weight:800;min-height:40px;padding:0 12px}
.cheat{border-color:rgba(125,211,90,.5);background:linear-gradient(135deg,#f2fbec,#fff 65%)}
.afig{display:block;height:auto}
.wbars{display:flex;align-items:flex-end;gap:6px;position:relative;margin-top:12px;padding-bottom:22px}
.wcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.wcol i{width:100%;max-width:36px;border-radius:10px 10px 4px 4px;transition:height .6s cubic-bezier(.2,1.2,.4,1)}
.wv{font-size:11px;font-weight:700;color:var(--ink);margin-bottom:3px;white-space:nowrap}
.wd{position:absolute;bottom:-22px;font-size:12px;color:var(--mute)}.wd.on{color:var(--mango-d);font-weight:800}
.wgl{position:absolute;inset-inline:0;border-top:2px dashed var(--mute);opacity:.6;pointer-events:none;z-index:1}.wgl span{position:absolute;top:-18px;inset-inline-start:0;font-size:11px;color:var(--mute);background:var(--card);padding:0 4px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.ch{text-align:center;font-size:12px;color:var(--mute);font-weight:700;padding:2px 0}
.cday{min-height:52px;border-radius:12px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px 0}
.cday b{font-size:14px}.cday.on{outline:2px solid var(--mango);background:var(--mango2)}.cday.fut{opacity:.45}

const LESSONS=[
{g:'מים',t:'מה המים עושים לגוף',b:['כ-60% ממשקל הגוף של אדם בוגר הם מים. הם מווסתים את חום הגוף, מובילים חומרים מזינים לתאים ועוזרים לכליות לפנות פסולת.','כבר חוסר נוזלים קל, של 1–2% ממשקל הגוף, יכול לפגוע בריכוז ובמצב הרוח ולגרום לעייפות ולכאבי ראש.','לפעמים תחושת "רעב" היא בעצם צמא. לפני נשנוש, נסה כוס מים וחכה כמה דקות.'],q:'כמה אחוזים ממשקל הגוף של מבוגר הם מים?',o:['כ-20%','כ-40%','כ-60%','כ-90%'],a:2,x:'כ-60%. אצל תינוקות האחוז גבוה עוד יותר.'},
{g:'צום לסירוגין',t:'מה זה צום לסירוגין?',b:['צום לסירוגין קובע מתי אוכלים, לא רק מה אוכלים. השיטה הנפוצה היא 16:8: 16 שעות צום ו-8 שעות של חלון אכילה.','מחקרים מראים שהשיטה מורידה במשקל בערך כמו דיאטה רגילה עם אותה כמות קלוריות. היתרון: לרבים קל יותר לאכול פחות כשחלון האכילה מוגדר.','בזמן הצום מותר לשתות מים, קפה שחור ותה בלי סוכר.'],q:'בשיטת 16:8, כמה שעות ביום פתוח חלון האכילה?',o:['16','12','8','4'],a:2,x:'8 שעות אכילה ו-16 שעות צום.'},
{g:'צום לסירוגין',t:'מה קורה בגוף בזמן צום',b:['בשעות הראשונות אחרי ארוחה הגוף משתמש בסוכר מהאוכל. רמת האינסולין עולה ואז יורדת בהדרגה.','אחרי כ-12 שעות מאגרי הגליקוגן (סוכר שנאגר בכבד) מצטמצמים, והגוף משתמש יותר ויותר בשומן כדלק.','אחרי 16 שעות ומעלה הכבד מייצר יותר קטונים מהשומן. הזמנים משתנים מאדם לאדם, לפי מה שאכלת ולפי הפעילות שלך.'],q:'איך נקרא הסוכר שהגוף אוגר בכבד ובשרירים?',o:['גליקוגן','קטון','כולסטרול','אינסולין'],a:0,x:'גליקוגן. כשהוא מתרוקן, הגוף פונה יותר לשומן.'},
{g:'צום לסירוגין',t:'למי צום לא מתאים',b:['צום לסירוגין לא מתאים לכולם: נשים בהריון או מניקות, בני נוער מתחת לגיל 18, ומי שיש או היתה לו הפרעת אכילה.','מי שמטופל בתרופות לסוכרת או ללחץ דם צריך להתייעץ עם רופא לפני שמתחיל, כי הצום עלול לגרום לירידה מסוכנת בסוכר.','אם בזמן צום יש סחרחורת, חולשה קיצונית או דפיקות לב, מפסיקים ואוכלים.'],q:'מה עושים אם מרגישים סחרחורת חזקה באמצע צום?',o:['ממשיכים עד הסוף','שותים קפה','מפסיקים את הצום ואוכלים','עושים אימון'],a:2,x:'הבריאות קודמת לכל יעד. אפשר לנסות שוב מחר עם צום קצר יותר.'},
{g:'שובע',t:'חלבון: הסוד של השובע',b:['חלבון הוא אב המזון המשביע ביותר. הוא מאט את התרוקנות הקיבה ומשפיע על הורמוני הרעב.','לגוף "עולה" יותר אנרגיה לעכל חלבון: כ-20–30% מהקלוריות שלו נשרפות בעיכול, לעומת כ-5–10% בפחמימות.','בירידה במשקל, חלבון גם עוזר לשמור על השרירים.'],q:'איזה אב מזון דורש הכי הרבה אנרגיה לעיכול?',o:['שומן','פחמימה','חלבון','סוכר'],a:2,x:'חלבון. לכן כדאי שיהיה בכל ארוחה.'},
{g:'שובע',t:'סיבים תזונתיים',b:['סיבים נמצאים בירקות, בפירות, בקטניות ובדגנים מלאים. הם מוסיפים נפח בלי הרבה קלוריות ומאטים את ספיגת הסוכר.','ההמלצה היא כ-25 גרם סיבים ביום לנשים וכ-38 לגברים. רוב האנשים אוכלים בערך חצי מזה.','כשמעלים סיבים, מעלים גם שתייה. אחרת עלולה להיות נפיחות.'],q:'כמה גרם סיבים מומלץ לגבר ביום?',o:['כ-5','כ-15','כ-38','כ-100'],a:2,x:'כ-38 גרם לגברים וכ-25 לנשים.'},
{g:'שינה',t:'שינה ותיאבון',b:['שינה קצרה משבשת את הורמוני הרעב: הגרלין, שמגביר רעב, עולה, והלפטין, שמאותת שובע, יורד.','אחרי לילה קצר נוטים לאכול יותר, ובמיוחד מאכלים מתוקים ושמנים.','7–9 שעות שינה הן חלק מהתוכנית לירידה במשקל, לא פחות מהתזונה.'],q:'איזה הורמון מגביר את תחושת הרעב?',o:['לפטין','גרלין','אינסולין','מלטונין'],a:1,x:'גרלין, "הורמון הרעב". הוא עולה כשלא ישנים מספיק.'},
{g:'שתייה',t:'קלוריות נוזליות',b:['קלוריות משתייה כמעט לא משביעות. הגוף לא "סופר" אותן כמו אוכל.','פחית קולה (330 מ״ל) מכילה כ-35 גרם סוכר, כמעט 9 כפיות.','החלפה של משקה ממותק אחד ביום במים או במשקה בלי סוכר חוסכת כ-1,000 קלוריות בשבוע.'],q:'כמה כפיות סוכר יש בערך בפחית קולה?',o:['2','5','9','15'],a:2,x:'כ-35 גרם סוכר, כמעט 9 כפיות.'},
{g:'משקל',t:'למה המשקל קופץ',b:['המשקל יכול לזוז 1–2 ק״ג ביום אחד בגלל מים, לא בגלל שומן.','מלח גורם לגוף לאגור מים, וכל גרם פחמימה שנאגר כגליקוגן קושר בערך 3 גרם מים.','לכן מסתכלים על המגמה לאורך שבועות, לא על יום אחד. שקילה פעם בשבוע, באותה שעה, נותנת תמונה מדויקת יותר.'],q:'למה המשקל יכול לעלות קילו אחרי ארוחה מלוחה?',o:['כי נוסף קילו שומן','בגלל אגירת מים','בגלל השרירים','זה לא אפשרי'],a:1,x:'אגירת מים. כדי לעלות קילו שומן צריך עודף של כ-7,700 קלוריות.'},
{g:'תנועה',t:'NEAT: השריפה הנסתרת',b:['NEAT היא האנרגיה שנשרפת בכל תנועה שאינה אימון: הליכה, עמידה, סידורים ומדרגות.','ההבדל ב-NEAT בין אנשים יכול להגיע למאות קלוריות ביום.','צעדים פשוטים: לדבר בטלפון בהליכה, לעלות במדרגות, לחנות רחוק יותר וללכת 10 דקות אחרי כל ארוחה.'],q:'מה מהבאים נחשב NEAT?',o:['אימון בחדר כושר','עלייה במדרגות','שינה','אכילה'],a:1,x:'כל תנועה יומיומית נספרת.'},
{g:'מתמטיקה של אוכל',t:'כמה קלוריות בכל גרם',b:['חלבון ופחמימה: 4 קלוריות לגרם. שומן: 9 קלוריות לגרם. אלכוהול: 7 קלוריות לגרם.','לכן כף שמן זית (כ-14 גרם) שווה כ-120 קלוריות, יותר מתפוח שלם.','שומן בריא חשוב, אבל כדאי למדוד אותו בכפית ולא לשפוך "בעין".'],q:'כמה קלוריות יש בגרם שומן?',o:['4','7','9','12'],a:2,x:'9 קלוריות לגרם, יותר מפי שניים מחלבון או מפחמימה.'},
{g:'סוכר',t:'סוכר נסתר',b:['ארגון הבריאות העולמי ממליץ שסוכר מוסף יהיה פחות מ-10% מהקלוריות היומיות, ועדיף פחות מ-5%.','סוכר מסתתר ברטבים, ביוגורטים בטעמים, בדגני בוקר ובמשקאות "בריאים".','טריק: קוראים את התווית. 4 גרם סוכר הם כפית.'],q:'כמה גרם סוכר יש בערך בכפית?',o:['1','4','10','20'],a:1,x:'כ-4 גרם. יוגורט עם 16 גרם סוכר = 4 כפיות.'},
{g:'הרגלים',t:'לאכול לאט',b:['למוח לוקח כ-20 דקות לקבל את אותות השובע מהקיבה.','מי שאוכל מהר מספיק לאכול הרבה לפני שהוא מרגיש שבע.','נסה להניח את המזלג בין ביסים, ללעוס היטב ולאכול בלי מסך.'],q:'כמה זמן לוקח בערך לאותות השובע להגיע למוח?',o:['2 דקות','20 דקות','שעתיים','יום'],a:1,x:'כ-20 דקות. לכן כדאי לחכות לפני מנה שנייה.'},
{g:'תנועה',t:'אימון כוח בירידה במשקל',b:['כשמורידים משקל, חלק מהירידה עלול להיות שריר ולא רק שומן.','אימוני כוח 2–3 פעמים בשבוע, יחד עם מספיק חלבון, עוזרים לשמור על השרירים.','שריר שומר על חילוף החומרים ועל המראה, וגם מחזק עצמות.'],q:'מה עוזר לשמור על שריר בזמן דיאטה?',o:['לדלג על ארוחות','אימוני כוח וחלבון','רק ריצות ארוכות','לשתות פחות'],a:1,x:'אימוני כוח וחלבון: שומרים על השריר ומורידים שומן.'},
{g:'שתייה',t:'מים לפני הארוחה',b:['במחקר מוכר, מבוגרים ששתו כחצי ליטר מים לפני כל ארוחה ירדו מעט יותר במשקל מקבוצה שלא שתתה.','המים ממלאים חלק מהקיבה ועוזרים להרגיש שובע מוקדם יותר.','הרגל קל: כוס גדולה של מים לפני כל ארוחה.'],q:'כמה מים שתו המשתתפים לפני כל ארוחה במחקר?',o:['כוס קטנה של 100 מ״ל','כחצי ליטר','2 ליטר','בכלל לא'],a:1,x:'כחצי ליטר, שתי כוסות.'},
{g:'צום לסירוגין',t:'מה מותר לשתות בצום',b:['בזמן צום מותר לשתות מים, מים מוגזים, קפה שחור ותה בלי סוכר.','גם כמות קטנה של חלב או סוכר "שוברת" את הצום מבחינת קלוריות.','שתייה מרובה בזמן צום עוזרת להפחית רעב וכאבי ראש.'],q:'מה מהבאים לא שובר צום?',o:['קפה עם סוכר','מיץ תפוזים','תה בלי סוכר','שוקו'],a:2,x:'תה בלי סוכר, מים וקפה שחור הם בסדר גמור.'},
{g:'צום לסירוגין',t:'איך בוחרים שיטת צום',b:['מתחילים בקטן: 12:12 (למשל מ-20:00 עד 8:00) כמעט טבעי לכל אחד.','אחרי שבוע–שבועיים אפשר לעבור ל-14:10 ואז ל-16:8.','שיטות קיצוניות כמו 20:4 או ארוחה אחת ביום לא מתאימות לכולם, וקשה לקבל בהן מספיק חלבון וסיבים.'],q:'באיזו שיטה מומלץ להתחיל?',o:['ארוחה אחת ביום','20:4','12:12','צום של 3 ימים'],a:2,x:'12:12: קל, טבעי ובונה הרגל.'},
{g:'קפאין',t:'כמה קפה זה יותר מדי?',b:['למבוגרים בריאים, עד כ-400 מ״ג קפאין ביום נחשב בטוח, בערך 3–4 כוסות קפה.','קפה שחור כמעט בלי קלוריות. הקלוריות מגיעות מחלב, מסוכר ומסירופים.','קפאין אחרי הצהריים עלול לפגוע בשינה, וזה משפיע על הרעב למחרת.'],q:'כמה קפאין ביום נחשב בטוח למבוגר בריא?',o:['עד 100 מ״ג','עד 400 מ״ג','עד 1,500 מ״ג','אין הגבלה'],a:1,x:'עד כ-400 מ״ג, כ-3–4 כוסות קפה.'},
{g:'משקל',t:'פלטו: כשהמשקל נתקע',b:['כשיורדים במשקל, הגוף צורך פחות אנרגיה, ולכן אותו תפריט מוריד פחות.','לפני שמשנים משהו, בודקים שהרישום מדויק: שמנים, רטבים ונשנושים קטנים.','מעדכנים את המשקל באפליקציה כדי לחשב מחדש את התקציב, מוסיפים צעדים ומתאזרים בסבלנות. לפעמים זו רק אגירת מים.'],q:'למה הירידה מאטה עם הזמן?',o:['כי הגוף קטן וצורך פחות אנרגיה','כי מים משמינים','בגלל הקפה','זה לא קורה'],a:0,x:'גוף קל יותר שורף פחות. לכן מעדכנים משקל ותקציב.'},
{g:'צלחת',t:'שיטת הצלחת',b:['חצי צלחת ירקות, רבע חלבון, רבע פחמימה, ומעט שומן בריא.','השיטה מאפשרת לאכול צלחת מלאה ומשביעה בלי לספור כל גרם.','כשמחליפים פחמימה לבנה במלאה, מקבלים יותר סיבים ויותר שובע.'],q:'איזה חלק מהצלחת צריך להיות ירקות?',o:['רבע','חצי','שליש','מעט מאוד'],a:1,x:'חצי צלחת ירקות: נפח גדול, מעט קלוריות.'},
{g:'שתייה',t:'גם תה ומרק נחשבים?',b:['כל הנוזלים נספרים: מים, תה, קפה ומרק, וגם מים ממזון כמו מלפפון ואבטיח.','סימן פשוט לשתייה מספקת: שתן בהיר.','בחום, באימון ובזמן צום צריך לשתות יותר.'],q:'מה סימן טוב לשתייה מספקת?',o:['שתן בהיר','צמא תמידי','שתן כהה','כאב ראש'],a:0,x:'שתן בהיר-צהבהב מעיד על שתייה טובה.'}];
LESSONS.push({g:'כושר',t:'חזרה לכושר אחרי הפסקה',b:['אחרי הפסקה ארוכה הגוף צריך כמה שבועות להסתגל. השרירים מתחזקים מהר יחסית, אבל גידים ומפרקים לאט יותר.','לכן מתחילים בעצימות נמוכה ומעלים בהדרגה, בערך 10% בשבוע.','כאב שרירים קל יום-יומיים אחרי אימון הוא נורמלי. כאב חד במפרק הוא סימן לעצור.'],q:'בכמה כדאי להעלות עומס אימונים כל שבוע?',o:['פי 2','בערך 10%','50%','לא להעלות אף פעם'],a:1,x:'בערך 10% בשבוע: מתקדמים בלי פציעות.'},

function curW(){const w=S.weights.slice().sort((a,b)=>a.d<b.d?-1:1);return w.length?w[w.length-1].w:S.profile.w0}
function calc(){const p=S.profile,w=curW();const bmr=10*w+6.25*p.h-5*p.age+(p.sex==='m'?5:-161);const tdee=bmr*p.act;const floor=p.sex==='m'?1500:1200;
 const target=tdee-p.pace*7700/7;const budget=Math.max(floor,Math.round(target/10)*10);const weekly=Math.max(0,(tdee-budget)*7/7700);const left=Math.max(0,w-p.goal);
 const weeks=left>0&&weekly>0?left/weekly:0;return{bmr,tdee,budget,weekly,left,weeks,floored:budget>target+5,bmi:w/((p.h/100)**2),w}}
function trend(){const w=S.weights.slice().sort((a,b)=>a.d<b.d?-1:1);if(w.length<2)return null;const span=diffDays(w[0].d,w[w.length-1].d);if(span<7)return null;
 const xs=w.map(x=>diffDays(w[0].d,x.d)),ys=w.map(x=>x.w),n=xs.length,mx=xs.reduce((a,b)=>a+b)/n,my=ys.reduce((a,b)=>a+b)/n;let nu=0,de=0;xs.forEach((x,i)=>{nu+=(x-mx)*(ys[i]-my);de+=(x-mx)**2});return de?-nu/de*7:null}
function units(f){const u=[];if(f.pc)u.push({k:'pc',n:f.pcn||'יחידה',g:f.pc});u.push({k:'g',n:'גרם',g:1});
 if(f.cup){u.push({k:'cup',n:'כוס',g:f.cup},{k:'tbsp',n:'כף',g:f.cup/16},{k:'tsp',n:'כפית',g:f.cup/48});if(!['drink','fat','sweet','spice'].includes(f.cat))u.push({k:'fist',n:'אגרוף',g:f.cup})}
 if(f.cat==='prot'){u.push({k:'palm',n:'כף יד',g:100});if(!f.cup)u.push({k:'fist',n:'אגרוף',g:150})}
 if(['nut','snack'].includes(f.cat))u.push({k:'hand',n:'חופן',g:f.cat==='nut'?30:20});
 if(['fruit','veg'].includes(f.cat)&&!f.cup)u.push({k:'fist',n:'אגרוף',g:150});return u}
function defUnit(f){const u=units(f);return (f.cat==='spice'&&u.find(x=>x.k==='tsp'))||(f.cat==='fat'&&u.find(x=>x.k==='tbsp'))||u.find(x=>x.k==='pc')||u.find(x=>x.k==='cup'&&f.cat==='drink')||u[0]}
function portion(f,q,unit){const g=q*unit.g,m=g/100;return{fid:f.id,n:f.n,cat:f.cat,q,u:unit.k,un:unit.n,g:r1(g),k:f.k*m,p:f.p*m,c:f.c*m,f:f.f*m,fi:f.fi*m,s:f.s*m}}
function sum(items){const t={k:0,p:0,c:0,f:0,fi:0,s:0,g:0,n:items.length,veg:0,junk:0};for(const e of items){t.k+=e.k;t.p+=e.p;t.c+=e.c;t.f+=e.f;t.fi+=e.fi;t.s+=e.s;t.g+=e.g||0;
 if(e.cat==='veg'||e.cat==='fruit')t.veg+=e.g||0;if(['sweet','snack','fast'].includes(e.cat))t.junk+=e.k}return t}
function dayTotals(day){return sum(MEALS.flatMap(([m])=>day.meals[m]))}
function exKcal(day){return day.ex.reduce((a,e)=>a+e.k,0)+stepsKcal(day)}
function scoreItems(items,meal){const t=sum(items);if(t.k<15)return null;if(items.some(x=>x.cheat))return{s:0,cheat:true,good:['ארוחת פינוק מתוכננת, בכמות מוגבלת. נהנים בלי רגשות אשמה.'],bad:['חוזרים לשגרה בארוחה הבאה: הרבה ירקות וחלבון.'],t,items};const B=S.profile?calc().budget:1800;let s=50;const good=[],bad=[];
 const pp=t.p*4/t.k,fib=t.fi/t.k*100,ed=t.g?t.k/t.g:2,sp=t.s*4/t.k,fp=t.f*9/t.k,share=t.k/B;
 if(pp>=.25){s+=18;good.push(`עשירה בחלבון (${r0(t.p)} ג׳) — משביעה לאורך זמן ושומרת על מסת השריר.`)}else if(pp>=.15){s+=8;good.push('יש בה כמות סבירה של חלבון.')}else{s-=8;bad.push('מעט חלבון. הוסף ביצה, קוטג׳, טונה, עוף או קטניות כדי להישאר שבע.')}
 if(fib>=2){s+=14;good.push(`הרבה סיבים תזונתיים (${r1(t.fi)} ג׳) — שובע ועיכול טוב.`)}else if(fib>=1){s+=6;good.push('כמות סיבים טובה.')}else{s-=6;bad.push('מעט סיבים. ירקות, לחם מלא או קטניות יעזרו.')}
 if(ed<=1.2){s+=12;good.push('נפח גדול במעט קלוריות — אוכלים הרבה ומרגישים מלא.')}else if(ed<=2){s+=4}else if(ed>3){s-=10;bad.push('צפיפות קלורית גבוהה: הרבה קלוריות בכמות קטנה של אוכל.')}
 if(sp<=.1){s+=6;good.push('מעט סוכר.')}else if(sp>.25){s-=12;bad.push('הרבה סוכר — צפויה נפילת אנרגיה ורעב מהיר.')}
 if(t.veg>=80){s+=10;good.push('יש בה ירקות או פירות — ויטמינים ונפח.')}else if(meal!=='s'){s-=4;bad.push('הוסף ירקות: אפשר כמעט בלי הגבלה.')}
 if(t.junk/t.k>.4){s-=12;bad.push('חלק גדול מהקלוריות מגיע ממתוקים, חטיפים או מזון מהיר.')}
 if(fp>.45){s-=6;bad.push('אחוז שומן גבוה. נסה פחות שמן או רטבים.')}
 if(meal==='s'?share>.2:share>.45){s-=12;bad.push(`ארוחה גדולה: ${r0(share*100)}% מהתקציב היומי שלך.`)}else if(share>=.15&&meal!=='s')good.push('גודל מנה שמתאים לתקציב היומי.');
 s=Math.max(5,Math.min(100,Math.round(s)));return{s,good,bad,t,items}}
function grade(s){return s>=85?['מצוינת','g1']:s>=70?['טובה מאוד','g1']:s>=55?['טובה','g2']:s>=40?['סבירה','g3']:['יש מה לשפר','g4']}
function dayScore(day){let a=0,n=0;for(const[m]of MEALS){const r=scoreItems(day.meals[m],m);if(r&&!r.cheat){a+=r.s*r.t.k;n+=r.t.k}}return n?Math.round(a/n):0}
function foodTag(f){const ed=f.k/100,pp=f.k?f.p*4/f.k:0;if(ed<=1.2||(pp>=.3&&ed<=2.5))return['var(--lime)','ירוק — אפשר בנדיבות'];if(ed<=2.6)return['var(--gold)','צהוב — במידה'];return['var(--mango)','כתום — בכמות קטנה']}

 if(got){setTimeout(()=>{toast('הישג חדש: '+got+' · +50');confetti()},700)}if(level().i>lv)setTimeout(()=>{toast('עלית רמה: '+level().name+'!');confetti()},1500)}

 const P=Array.from({length:120},()=>({x:c.width/2,y:c.height/3,vx:(Math.random()-.5)*12,vy:Math.random()*-12-3,r:Math.random()*6+3,c:cols[Math.random()*5|0],a:Math.random()*6}));let f=0;
 (function tick(){x.clearRect(0,0,c.width,c.height);for(const p of P){p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);x.restore()}if(++f<110)requestAnimationFrame(tick);else x.clearRect(0,0,c.width,c.height)})()}

function appVer(){try{return JSON.parse(KalilNative.appVersion())}catch(e){return{apk:0,html:APPV}}}
const UPD={st:'',info:null,quiet:false};
function updCard(){if(!isApk())return `<div class="card"><h2>עדכונים</h2><p class="small muted" style="margin:0">הגרסה בתוך Claude מתעדכנת אוטומטית. גרסת תוכן ${APPV}.</p></div>`;
 const v=appVer(),i=UPD.info;let body='';
 if(UPD.st==='checking')body='<div class="spin" style="margin:10px auto"></div><p class="small muted" style="text-align:center">בודק עדכונים...</p>';
 else if(UPD.st==='dl')body='<div class="spin" style="margin:10px auto"></div><p class="small muted" style="text-align:center">מוריד עדכון...</p>';
 else if(UPD.st==='err')body=`<p class="small" style="color:var(--red)">לא הצלחתי לבדוק עדכונים. בדוק חיבור לאינטרנט ונסה שוב.</p>`;
 else if(i&&i.apk>v.apk)body=`<p style="margin:0 0 6px"><b>גרסת אפליקציה חדשה זמינה (${esc(i.name||'')})</b></p>${i.notes?`<p class="small muted" style="margin:0">${esc(i.notes)}</p>`:''}<div class="btns"><button class="btn lime full" data-a="updApk">הורד והתקן</button></div><p class="small muted" style="margin:6px 0 0">בפעם הראשונה אנדרואיד יבקש לאשר התקנה מ"קליל". הנתונים נשמרים.</p>`;
 else if(i&&i.html>v.html)body=`<p style="margin:0 0 6px"><b>עדכון חדש זמין</b></p>${i.notes?`<p class="small muted" style="margin:0">${esc(i.notes)}</p>`:''}<div class="btns"><button class="btn lime full" data-a="updHtml">עדכן עכשיו (כמה שניות)</button></div>`;
 else if(i)body='<p class="small" style="color:var(--mango-d);margin:0">יש לך את הגרסה האחרונה.</p>';
 return `<div class="card" id="updCard"><h2>עדכונים<span class="sp"></span><span class="small muted">אפליקציה ${v.apk} · תוכן ${v.html}</span></h2>${body}<div class="btns"><button class="btn ghost full" data-a="updCheck">חפש עדכון</button></div></div>`}
function rUpd(){const el=$('#updCard');if(el)el.outerHTML=updCard()}
function updCheck(quiet){if(!isApk()||UPD_BASE.indexOf('__')===0)return;UPD.quiet=!!quiet;if(!quiet){UPD.st='checking';rUpd()}try{KalilNative.checkUpdate(UPD_BASE+'version.json')}catch(e){UPD.st='err';rUpd()}}
window.__upd=(err,txt)=>{if(err){UPD.st=UPD.quiet?'':'err';rUpd();return}try{UPD.info=JSON.parse(txt);UPD.st=''}catch(e){UPD.st='err'}rUpd();const v=appVer(),i=UPD.info;
 if(i&&(i.apk>v.apk||i.html>v.html)){showUndoMsg('יש עדכון חדש לקליל! מסך "מטרות" ← עדכונים');S.updSeen=today();saveState()}else if(!UPD.quiet)toast('יש לך את הגרסה האחרונה')};
window.__updErr=e=>{UPD.st='err';rUpd();toast('העדכון נכשל. נסה שוב')};
setTimeout(()=>{if(isApk()&&S.lastUpdCheck!==today()){S.lastUpdCheck=today();saveState();updCheck(true)}},4000);

<div class="btns"><button class="btn ghost" data-a="aiText">נתח את התיאור</button></div>`);if(tell){const t=$('#aiTxt');if(t){t.rows=3;setTimeout(()=>t.focus(),250)}}}
async function runAI(withImg){const box=$('#aiBox');let sample=null;try{sample=window.claude&&claude.use?await claude.use('sample'):null}catch(e){}
 const txt=($('#aiTxt')||{}).value||'';if(!withImg&&!txt.trim()){box.innerHTML='<p class="small">כתוב קודם מה אכלת.</p>';return}
 if(!sample){const key=ls.get('kl_key');if(!key){box.innerHTML=keyForm(withImg);return}sample={json:(pr,o)=>apiJson(pr,o,key)}}
 AI.ctl&&AI.ctl.abort();AI.ctl=new AbortController();
 box.innerHTML=`${AI.url&&withImg?`<img class="photo" src="${AI.url}" alt="התמונה שצילמת" style="margin-top:12px">`:''}<div style="text-align:center;padding:18px"><div class="spin"></div><p class="muted">אבוקי בוחן את הצלחת...</p><button class="btn ghost" data-a="aiStop">עצור</button></div>`;
 const prompt=`אתה תזונאי ישראלי מומחה. ${withImg?'בתמונה מצולמת ארוחה.':''} ${txt.trim()?'תיאור מהמשתמש: "'+txt.trim().slice(0,600)+'".':''}
פרק את הארוחה לרכיבים נפרדים (כולל שמן, רטבים וממרחים שנראים או סבירים), הערך את משקל כל רכיב בגרמים לפי גודל המנה, וחשב ערכים תזונתיים לכל הכמות של הרכיב.
החזר JSON בלבד במבנה: {"items":[{"n":"שם בעברית","g":120,"k":200,"p":10,"c":20,"f":8,"fi":3,"s":2,"cat":"veg"}],"note":"משפט קצר בעברית על הארוחה"}
k=קלוריות, p=חלבון, c=פחמימה, f=שומן, fi=סיבים, s=סוכר (כולם בגרמים לכל הכמות). cat אחד מ: veg,fruit,bread,grain,prot,egg,dairy,leg,nut,fat,drink,sweet,snack,dish,fast.
אם אין אוכל בתמונה החזר {"items":[],"note":"לא זיהיתי אוכל בתמונה"}.`;
 try{const opt={signal:AI.ctl.signal};if(withImg&&AI.file)opt.images=[AI.file];const res=await sample.json(prompt,opt);
  const it=(res&&Array.isArray(res.items)?res.items:[]).slice(0,20).map(x=>{const g=Math.max(1,+x.g||100),cat=CATS[x.cat]?String(x.cat):'dish';return{n:String(x.n||'רכיב').slice(0,50),g,g0:g,k0:Math.max(0,+x.k||0),p0:Math.max(0,+x.p||0),c0:Math.max(0,+x.c||0),f0:Math.max(0,+x.f||0),fi0:Math.max(0,+x.fi||0),s0:Math.max(0,+x.s||0),cat}});
  AI.items=it;AI.note=String(res&&res.note||'').slice(0,200);if(withImg){S.aw.photo=1;saveState();checkBadges()}renderAI()}
 catch(e){const c=e&&e.code;if(c==='cancelled'){box.innerHTML='';return}box.innerHTML=`<p class="small" style="color:var(--red)">${c==='not_granted'||c==='sampling_disabled'?'לא ניתן אישור לשימוש ב-AI.':c==='rate_limited'?'יותר מדי בקשות כרגע. נסה שוב בעוד רגע.':c==='image_rejected'?'התמונה לא התקבלה. נסה תמונה אחרת.':c==='images_unavailable'?'שליחת תמונות לא זמינה כאן — נסה לתאר במילים.':c==='bad_key'?'מפתח ה-API לא תקין. נסה שוב עם מפתח אחר.':'משהו השתבש. נסה שוב.'}</p>`}}
function keyForm(withImg){return `<div class="card"><b>חיבור ה-AI באפליקציה</b><p class="small muted">כדי לנתח תמונות בתוך האפליקציה צריך מפתח API אישי של Anthropic (מ-console.anthropic.com). הוא נשמר רק בטלפון שלך. כל ניתוח עולה כמה אגורות בחשבון ה-API שלך.</p>
<input type="text" id="keyIn" placeholder="sk-ant-..." style="direction:ltr" autocomplete="off"><div class="btns"><button class="btn" data-a="keySave" data-img="${withImg?1:0}">שמור ונתח</button></div></div>`}
async function shrink(file){try{const bm=await createImageBitmap(file);const sc=Math.min(1,1280/Math.max(bm.width,bm.height));const c=document.createElement('canvas');c.width=Math.round(bm.width*sc);c.height=Math.round(bm.height*sc);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.85).split(',')[1]}
 catch(e){return await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(file)})}}
async function apiJson(prompt,opt,key){const content=[];if(opt.images&&opt.images[0])content.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:await shrink(opt.images[0])}});content.push({type:'text',text:prompt+'\nהחזר JSON בלבד, בלי טקסט נוסף.'});
 let r;try{r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:opt.signal,headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-5-5',max_tokens:2000,messages:[{role:'user',content}]})})}
 catch(e){throw{code:e&&e.name==='AbortError'?'cancelled':'upstream_error'}}
 if(r.status===401){ls.set('kl_key',null);throw{code:'bad_key'}}if(r.status===429)throw{code:'rate_limited'};if(!r.ok)throw{code:'upstream_error'};
 const j=await r.json();const t=(j.content||[]).map(x=>x.text||'').join('');const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0)throw{code:'upstream_error'};return JSON.parse(t.slice(a,b+1))}

 box.innerHTML=`${AI.url?`<img class="photo" src="${AI.url}" alt="התמונה שצילמת" style="margin-top:12px">`:''}${AI.note?`<div class="bubble" style="background:var(--lime2);color:var(--ink)">${avoki('wow')}<span>${esc(AI.note)}</span></div>`:''}
<h4 style="margin:14px 0 4px">מה מצאתי בצלחת <span class="small muted">(אפשר לתקן גרמים)</span></h4>${AI.items.map((x,i)=>`<div class="ai-row"><div>${esc(x.n)}<div class="small muted">${r0(E[i].k)} קק״ל · ח ${r0(E[i].p)}</div></div><input type="number" inputmode="numeric" data-ai="${i}" value="${r0(x.g)}" aria-label="גרם"><button class="del" data-a="aiDel" data-i="${i}" aria-label="הסר">${IC.trash}</button></div>`).join('')}
<div style="text-align:center;margin-top:14px"><div class="kbig">${r0(t.k)}</div><div class="muted small">קק״ל בסך הכל · הערכה בלבד</div></div>${r?`<div class="card">${scoreBlock(r)}</div>`:''}

 tbx:b=>{const T=S.tab,k=b.dataset.k,d=+b.dataset.d,st={work:5,rest:5,rounds:1,sets:1,setRest:15}[k],lim={work:[10,60],rest:[5,60],rounds:[2,12],sets:[1,4],setRest:[15,180]}[k];T[k]=Math.min(lim[1],Math.max(lim[0],T[k]+d*st));saveState();openTabata()},
 tbEx:b=>{const T=S.tab,id=b.dataset.id;T.ex=T.ex.includes(id)?T.ex.filter(x=>x!==id):T.ex.concat(id);if(!T.ex.length)T.ex=['squat'];saveState();openTabata()},
 tbGentle:()=>{Object.assign(S.tab,{work:20,rest:20,rounds:6,sets:1,setRest:60,ex:['chair','wallpu','bridge','calf']});saveState();openTabata()},
 tbStart:()=>{saveState();openWorkout('t')},
 fitGo:b=>openWorkout(b.dataset.t),plNext:()=>{clearInterval(PL_.t);PL_.i++;const n=PL_.st[PL_.i];if(!n)return finishWorkout();PL_.left=n.sec||0;showStep()},
 plToggle:()=>{PL_.run=!PL_.run;const b=$('#plTog');if(b)b.textContent=PL_.run?'השהה':'המשך';if(PL_.run)runTimer();else clearInterval(PL_.t)},
 plFeel:b=>{logWorkout(PL_.type,b.dataset.f);closeSheet();render();toast(b.dataset.f==='hard'?'נרשם. נשמור על הקצב.':b.dataset.f==='easy'?'מעולה! בשקילה הבאה נשקול לעלות רמה':'אימון נרשם. כל הכבוד!')},
 fitLvl:b=>{S.fit.level=Math.min(8,Math.max(1,fitLv()+ +b.dataset.d));S.fit.lvlAt=today();saveState();render();toast('רמת אימון: '+fitLv())},
 goToday:()=>{V.date=today();render()},tell:()=>{if(!S.profile)return openProfile();openPhoto(null,true)},
 undo:()=>{const f=UNDO.fn;UNDO.fn=null;$('#undo').classList.add('hide');if(f){f();toast('שוחזר')}},
 label:()=>$('#lbl').click(),
 quickTray:b=>{const f=foodById(b.dataset.id);if(!f)return;const u=defUnit(f);A.tray.push(portion(f,u.k==='g'?100:1,u));sfx('pop');toast('נוסף לצלחת: '+f.n);renderTray();b.classList.add('pop');setTimeout(()=>b.classList.remove('pop'),400)},
 stepPerm:()=>{try{KalilNative.requestPermission()}catch(e){}},
 stepsSave:()=>{const v=Math.max(0,Math.round(+($('#stIn')||{}).value||0));const day=getDayLocal(V.date);day.steps=v;day.stepsMan=v;stepsReached(V.date,day);saveDay(V.date);checkBadges();render();toast('עודכן: '+v.toLocaleString('he-IL')+' צעדים')},
 stepsAdd:b=>{const day=getDayLocal(V.date);day.steps=(day.steps||0)+ +b.dataset.n;stepsReached(V.date,day);saveDay(V.date);checkBadges();render()},
 edit:b=>{const day=getDayLocal(V.date),m=b.dataset.m,i=+b.dataset.i,e=day.meals[m][i];if(!e)return;A.meal=m;openFood((e.fid&&foodById(e.fid))||foodFromEntry(e),{m,i,e})},
 saveEdit:()=>{if(!(A.qty>0)||!A.edit)return;const day=getDayLocal(V.date),{m,i}=A.edit,e=portion(A.food,A.qty,A.unit);if(!A.food.id){e.fid=A.edit.e.fid||''}
  if(A.meal===m)day.meals[m][i]=e;else{day.meals[m].splice(i,1);day.meals[A.meal].push(e)}saveDay(V.date);checkBadges();closeSheet();render();toast('עודכן')},
 delEdit:()=>{if(!A.edit)return;sfx('del');const day=getDayLocal(V.date),m=A.edit.m,i=A.edit.i,e=day.meals[m].splice(i,1)[0];saveDay(V.date);closeSheet();render();showUndo('נמחק: '+e.n,()=>{getDayLocal(V.date).meals[m].splice(i,0,e);saveDay(V.date);render()})},
 editCustom:()=>openCustom(S.custom.find(x=>x.id===A.food.id)),
 delCustom:()=>{const id=(A.food||{}).id;S.custom=S.custom.filter(x=>x.id!==id);S.favs=S.favs.filter(x=>x!==id);S.recent=S.recent.filter(x=>x!==id);saveState();toast('המאכל נמחק');openAdd(A.meal)},
 del:b=>{const day=getDayLocal(V.date);day.meals[b.dataset.m].splice(+b.dataset.i,1);saveDay(V.date);render()},
 score:b=>openScore(b.dataset.m),
 copy:async b=>{const y=addDays(V.date,-1);await pullDay(y);const yd=getDayLocal(y),it=yd.meals[b.dataset.m];if(!it.length){toast('אתמול לא נרשם כלום בארוחה הזו');return}addEntries(b.dataset.m,JSON.parse(JSON.stringify(it)));render()},
 water:b=>{const day=getDayLocal(V.date),ml=+b.dataset.ml;day.water=Math.max(0,(day.water||0)+ml);try{navigator.vibrate&&navigator.vibrate(25)}catch(e){}
  if(ml>0)sfx('water');toast(WMSG[Math.random()*WMSG.length|0]+' +'+ml+' מ״ל');if(day.water>=waterGoal()&&!S.aw['w:'+V.date]){award('w:'+V.date,15,'יעד המים הושלם!');confetti()}saveDay(V.date);checkBadges();render()},
 lesson:openLesson,
 ans:b=>{const d=today(),L=lessonFor(d);if(S.lessons[d]!=null)return;const i=+b.dataset.i,ok=i===L.a;S.lessons[d]=ok;
  document.querySelectorAll('#opts .opt').forEach((x,j)=>{x.disabled=true;if(j===L.a)x.classList.add('ok');else if(j===i)x.classList.add('no')});$('#lx').classList.remove('hide');
  if(ok){award('les:'+d,20,'תשובה נכונה!');confetti()}else award('les:'+d,5,'למדת משהו חדש');saveState();checkBadges();saveState();render()},
 fplan:b=>{S.fast.plan=+b.dataset.h;S.fast.on=true;saveState();render()},
 fastStart:()=>{const v=($('#fStart')||{}).value;const d=new Date();if(v){const[H,M]=v.split(':').map(Number);d.setHours(H,M,0,0);if(d>new Date())d.setDate(d.getDate()-1)}
  sfx('fast');S.fast.start=d.getTime();S.fast.on=true;saveState();render();toast('הצום התחיל! בהצלחה');try{navigator.vibrate&&navigator.vibrate([30,60,30])}catch(e){}},
 fastEnd:()=>{const h=fastElapsed(),F=S.fast;if(h<.05){F.start=null;saveState();render();return}F.hist.unshift({s:F.start,e:Date.now(),h:r1(h),g:F.plan});F.hist=F.hist.slice(0,60);F.start=null;
  if(h>=F.plan){award('fd:'+today(),25,'צום הושלם!');confetti()}else toast('צמת '+r1(h)+' שעות. כל שעה נחשבת!');saveState();checkBadges();saveState();render()},
 exAdd:openEx,exq:b=>{const el=$('#exM');el.value=Math.max(5,(+el.value||0)+ +b.dataset.d);exPv()},
 exSave:()=>{const t=EXS[+$('#exT').value],m=+$('#exM').value||0;if(m<=0)return;const day=getDayLocal(V.date);day.ex.push({n:t[0],min:m,k:t[1]*curW()*m/60});award('x:'+V.date,10,'אימון');saveDay(V.date);checkBadges();closeSheet();render()},
 exDel:b=>{const day=getDayLocal(V.date);day.ex.splice(+b.dataset.i,1);saveDay(V.date);render()},
 weigh:()=>{const w=+$('#wIn').value;if(!(w>30&&w<350))return toast('משקל לא תקין');const t=today();S.weights=S.weights.filter(x=>x.d!==t);S.weights.push({d:t,w});award('wt:'+t,20,'שקילה');const fm=fitCheck();saveState();checkBadges();saveState();render();toast('נשמר: '+r1(w)+' ק״ג');if(fm)setTimeout(()=>showUndoMsg(fm),2400)},
 pick1:b=>b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)),
 custom:()=>openCustom(),backup:openBackup,
 bkCopy:async()=>{try{await navigator.clipboard.writeText($('#bk').value);$('#bkMsg').textContent='הועתק!'}catch(e){$('#bk').select();$('#bkMsg').textContent='סמן והעתק ידנית.'}},
 bkLoad:()=>{try{const o=JSON.parse($('#bk').value);if(!o.state||!o.state.profile)throw 0;S=Object.assign(S,o.state);Object.entries(o.days||{}).forEach(([d,v])=>{dayCache[d]=v;ls.set('kl_d_'+d,v);dbWrite('d-'+d,()=>dayCache[d])});saveState();closeSheet();render();toast('שוחזר בהצלחה')}catch(e){$('#bkMsg').textContent='הטקסט לא תקין.'}},
 snap:()=>$('#pic').click(),aiText:()=>{AI.url=null;AI.file=null;runAI(false)},aiStop:()=>{AI.ctl&&AI.ctl.abort()},
 keySave:b=>{const k=($('#keyIn').value||'').trim();if(!k.startsWith('sk-'))return toast('מפתח לא תקין');ls.set('kl_key',k);runAI(b.dataset.img==='1')},
 aiDel:b=>{AI.items.splice(+b.dataset.i,1);renderAI()},aimeal:b=>{AI.m=b.dataset.m;renderAI()},
 aiAdd:()=>{const E=aiEntries();if(!E.length)return;addEntries(AI.m,E);closeSheet();V.tab='today';V.date=today();render();toast('הארוחה נוספה')}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;if(!['water','addFood','toTray','trayAdd','delEdit','ans'].includes(b.dataset.a))sfx('tap');if(b.closest('#sheet')&&!b.closest('#sheetIn')){}const f=act[b.dataset.a];if(f){e.preventDefault();f(b,e)}});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='q'){A.q=t.value;renderRes()}else if(t.id==='qty'){A.qty=Math.max(0,+t.value||0);renderQ();preview()}else if(t.id==='exM')exPv();
 else if(t.dataset.ai!=null){const x=AI.items[+t.dataset.ai];if(x){x.g=Math.max(1,+t.value||1);clearTimeout(renderAI.t);renderAI.t=setTimeout(()=>{const pos=t.dataset.ai;renderAI();const el=document.querySelector(`[data-ai="${pos}"]`);if(el){el.focus();const v=el.value;el.value='';el.value=v}},700)}}});
document.addEventListener('change',e=>{if(e.target.id==='exT')exPv()});
$('#lbl').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(f)scanLabel(f)});
$('#pic').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;AI.file=f;if(AI.url)URL.revokeObjectURL(AI.url);AI.url=URL.createObjectURL(f);e.target.value='';runAI(true)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
setInterval(()=>{if(S.act){const t=fmtHMS(actElapsed());const a1=$('#actChip');if(a1)a1.textContent=t;const a2=$('#actChip2');if(a2)a2.textContent=t}},1000);
setInterval(()=>{if(!S.fast||!S.fast.start)return;const h=fastElapsed(),g=S.fast.plan;const a=$('#fT');if(a)a.textContent=fmtH(h);const r=$('#fR');if(r)r.textContent=h>=g?'יעד הושג!':'נותרו '+fmtH(g-h);
 const c=$('#fChip');if(c)c.textContent=fmtH(h);const arc=$('#fArc');if(arc){const C=2*Math.PI*46;arc.setAttribute('stroke-dasharray',C*Math.min(1,h/g)+' '+C)}const st=stageAt(h);if(V.tab==='fast'&&V.st!=null&&st!==V.st)render();V.st=st},1000);
window.__back=()=>{if($('#sheet').classList.contains('open')){closeSheet();return true}if(V.tab!=='today'){V.tab='today';render();return true}return false};
render();
}
</script>
</body>
